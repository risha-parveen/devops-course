<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { 
            width: 400px; 
        }
        button { 
            width: 100%; 
            padding: 10px; 
            margin: 5px 0; 
            cursor: pointer; 
        }
        .textarea { 
            width: calc(100% - 20px); 
            height: 500px; 
            padding: 10px;
            margin-top: 10px; 
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
    <script>
        async function sendRequest() {
            const textarea = document.getElementById('response');
            
            try {
                const response = await fetch('/api', {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                const formattedText = `Service1:

- IP address information: ${data.Service1['IP address information']}
- List of running processes:
${data.Service1['list of running processes']}
- Available disk space:
${data.Service1['available disk space']}
- Time since last boot: ${data.Service1['time since last boot']}

Service2:

- IP address information: ${data.Service2['IP address information']}
- List of running processes:
${data.Service2['list of running processes']}
- Available disk space:
${data.Service2['available disk space']}
- Time since last boot: ${data.Service2['time since last boot']}`;

                textarea.value = formattedText;
            } catch (error) {
                textarea.value = `Error: ${error.message}`;
            }
        }

        async function stopService() {
            if (confirm('Are you sure you want to stop all services?')) {
                try {
                    const response = await fetch('/shutdown', {
                        method: 'POST',
                        headers: {
                            'Accept': 'application/json'
                        }
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    document.getElementById('response').value = 'Please wait. Shutting down all services...';
                    
                    // Wait a moment and then show a final message
                    setTimeout(() => {
                        document.body.innerHTML = '<h1>Services have been shut down.</h1>';
                    }, 10000);
                } catch (error) {
                    document.getElementById('response').value = `Error during shutdown: ${error.message}`;
                }
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <h2>Dashboard</h2>
        <button onclick="sendRequest()" style="background-color: rgb(50, 49, 49); color: white; font-weight: bold;">REQUEST</button>
        <button onclick="stopService()" style="background-color: rgb(207, 207, 207); color: black; font-weight: bold;">STOP</button>
        <textarea id="response" class="textarea" readonly></textarea>
    </div>
</body>
</html>
