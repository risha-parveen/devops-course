upstream backend {
    server service1:8199;
    least_conn;
}

server {
    listen 8198;
    
    include /etc/nginx/mime.types;

    location / {
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        root /usr/share/nginx/html;
        index index.html;
    }

    location /request {
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://backend/request;
    }

    location /shutdown {
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://backend/shutdown;
    }

    location /run-log {
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://backend/run-log;
        proxy_set_header Content-Type text/plain;
        proxy_set_header Accept text/plain;
    }
}

# New API gateway server block (8197)
server {
    listen 8197;

    include /etc/nginx/mime.types;

    location / {
        return 200 "API Gateway running on port 8197\n";
    }

    location /request {
        proxy_pass http://backend/request;
        proxy_set_header Content-Type "text/plain";
        proxy_set_header Accept "text/plain";
    }

    location /run-log {
        proxy_pass http://backend/run-log;
        proxy_set_header Content-Type "text/plain";
        proxy_set_header Accept "text/plain";
    }
}