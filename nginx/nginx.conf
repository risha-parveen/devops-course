upstream backend {
    server service1:8199;
    server service1:8199;
    server service1:8199;
    least_conn;
}

upstream backend_single {
    server service1:8199 max_fails=1 fail_timeout=10s;
}

server {
    listen 8198;
    
    include /etc/nginx/mime.types;

    location / {
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        root /usr/share/nginx/html;
        index index.html;
    }

    location /request {
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://backend/request;
    }

    location /shutdown {
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://backend/shutdown;
    }

    location /run-log {
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://backend/run-log;
    }

    location /monitoring {
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://backend/monitoring;
    }
}

# New API gateway server block (8197)
server {
    listen 8197;

    include /etc/nginx/mime.types;

    location / {
        return 200 "API Gateway running on port 8197\n";
    }

    location /state {
        limit_except GET PUT {
            deny all;
        }
        
        proxy_pass http://backend_single/state;
        proxy_set_header Content-Type "text/plain";
        proxy_set_header Accept "text/plain";
        # Pass authorization header if it exists
        proxy_set_header Authorization $http_authorization;
    }

    location /request {
        proxy_pass http://backend_single/request;
        proxy_set_header Content-Type "text/plain";
        proxy_set_header Accept "text/plain";
    }

    location /run-log {
        proxy_pass http://backend_single/run-log;
        proxy_set_header Content-Type "text/plain";
        proxy_set_header Accept "text/plain";
    }
}