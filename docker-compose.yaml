services:
  # Service1 definition - Main application service
  service1:  
    image: risha/service1  # Custom image name for service1
    depends_on:
      - service2  # Ensures service2 starts before service1
    build:
      dockerfile: Dockerfile  # Specifies the Dockerfile to build the image
      context: ./service1    # Build context directory containing the Dockerfile and source code
    deploy:
      replicas: 3 # Creates 3 instances of service1 for high availability and load balancing
    networks:
      - backend  # Connects the service to the "backend" network for internal communication
    environment:
      # URL for service2 using Docker's internal DNS resolution
      - SERVICE2_BASE_URL=http://service2:8200
      - INIT_STATE=true     # Environment variable for initialization state
    volumes:
      # Mounts Docker socket to allow container to interact with Docker daemon
      # Note: This can be a security risk - only use if necessary
      - /var/run/docker.sock:/var/run/docker.sock

  # Nginx service - Acts as a reverse proxy/load balancer
  nginx:
    build: ./nginx          # Builds nginx image from ./nginx directory
    ports:
      # Maps host ports to container ports
      - "8198:8198" # External access port for main application
      - "8197:8197" # Additional port mapping for other features
    networks:
      - backend    # Connects nginx to backend network to communicate with other services
    depends_on:
      - service1   # Ensures service1 starts before nginx

  # Service2 definition - Supporting service
  service2:  
      image: risha/service2  # Custom image name for service2
      build:
        dockerfile: Dockerfile  # Specifies the Dockerfile to build the image
        context: ./service2    # Build context directory for service2
      networks:
        - backend  # Connects service2 to backend network for internal communication

# Network configuration
networks:
  backend:  # Defines a custom Docker network named "backend"