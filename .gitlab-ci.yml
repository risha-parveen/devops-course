stages:
  - build
  - test
  - deploy
  - cleanup

variables:
  DOCKER_COMPOSE_VERSION: "2.21.0"

default:
  tags:
    - Mac-runner

before_script:
  - |
    if [ -z "$NGINX_USER" ] || [ -z "$NGINX_PASS" ]; then
      echo "Error: Required variables NGINX_USER and/or NGINX_PASS are not set"
      exit 1
    fi
  - docker info
  - docker-compose --version

build:
  stage: build
  script:
    - echo "Building the images..."
    - docker-compose build
    - echo "Build completed"
  rules:
    - if: '$CI_COMMIT_BRANCH == "project"'

test:
  stage: test
  script:
    - docker-compose up -d
    - sleep 10
    - |
      response=$(curl -s -o /dev/null -w "%{http_code}" -u "${NGINX_USER}:${NGINX_PASS}" http://localhost:8198)
      if [ "$response" != "200" ]; then
        echo "Nginx test failed with status $response"
        exit 1
      fi
    - echo "Basic tests passed"
  rules:
    - if: '$CI_COMMIT_BRANCH == "project"'

deploy:
  stage: deploy
  script:
    - echo "Deploying application..."
    - docker-compose up -d
    - sleep 10
    - |
      response=$(curl -s -o /dev/null -w "%{http_code}" -u "${NGINX_USER}:${NGINX_PASS}" http://localhost:8198)
      if [ "$response" != "200" ]; then
        echo "Deployment verification failed"
        exit 1
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "project"'

cleanup:
  stage: cleanup
  script:
    - docker-compose down
    - docker system prune -f
  when: manual
