image: 
  name: docker:20.10.16

services:
  - name: docker:20.10.16-dind

variables:
    DOCKER_HOST: tcp://docker:2376/
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
before_script:
  # - echo "Ensuring Docker doesn't use TLS..."
  # - rm -rf /root/.docker /certs  # ✅ Remove any lingering TLS configs
  # - apk add --no-cache docker-cli docker-cli-compose
  - until docker info; do echo "Waiting for Docker daemon..."; sleep 1; done

stages:
  - build
  # - test
  # - deploy
  # - cleanup

default:
  tags:
    - new-runner

build:
  stage: build
  script:
    - echo "Building the images..."
    - docker-compose build
    - echo "Build completed"
  rules:
    - if: '$CI_COMMIT_BRANCH == "project"'

