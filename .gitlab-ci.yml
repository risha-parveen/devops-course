default:
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - |
      if [ -z "$NGINX_USER" ] || [ -z "$NGINX_PASS" ]; then
        echo "Error: Required variables NGINX_USER and/or NGINX_PASS are not set"
        exit 1
      fi
    - apk add --no-cache nodejs npm


stages:
  - build
  - test
  - deploy
  - cleanup

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  IS_DOCKER: 1

build:
  script:
    - docker-compose build
    - docker-compose up -d  # Run in detached mode
    - echo "List of Docker networks:"
    - docker network ls
    - docker-compose -f docker-compose.yaml -f docker-compose.test.yaml up

test:
  stage: test
  script:
    - echo "NGINX_USER=$NGINX_USER" > .env
    - echo "NGINX_PASS=$NGINX_PASS" >> .env
    - docker-compose -f docker-compose.yaml -f docker-compose.test.yaml up
  rules:
    - if: '$CI_COMMIT_BRANCH == "project"'

deploy:
  stage: deploy
  variables:
    GIT_STRATEGY: none
  script:
    # Create deployment script
    - |
      cat > deploy.sh << 'EOF'
      #!/bin/sh
      # Stop any existing containers
      docker-compose down || true
      
      # Remove old images
      docker-compose rm -f || true
      
      # Pull new images
      docker-compose pull || true
      
      # Start the new containers
      docker-compose up -d
      
      # Wait for services to be healthy
      echo "Waiting for services to be healthy..."
      sleep 10
      
      # Check if services are running
      if docker-compose ps | grep -q "Up"; then
        echo "Deployment successful!"
        exit 0
      else
        echo "Deployment failed!"
        docker-compose logs
        exit 1
      fi
      EOF
    - chmod +x deploy.sh
    # Execute deployment
    - ./deploy.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "project"'
  environment:
    name: production
    
cleanup:
  stage: cleanup
  script:
    - docker system prune -f
  rules:
    - if: '$CI_COMMIT_BRANCH == "project"'
  when: always
