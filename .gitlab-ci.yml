default:
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - |
      if [ -z "$NGINX_USER" ] || [ -z "$NGINX_PASS" ]; then
        echo "Error: Required variables NGINX_USER and/or NGINX_PASS are not set"
        exit 1
      fi
    - apk add --no-cache nodejs npm


stages:
  - build
  - test
  # - deploy
  # - cleanup

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  IS_DOCKER: 1

build:
  stage: build
  script:
    - docker-compose build

test:
  stage: test
  script:
    - echo "NGINX_USER=$NGINX_USER" > .env
    - echo "NGINX_PASS=$NGINX_PASS" >> .env
    - docker-compose -f docker-compose.yaml -f docker-compose.test.yaml up --build --abort-on-container-exit
    
  rules:
    - if: '$CI_COMMIT_BRANCH == "project"'
