image: docker:latest  # Use Docker image instead of Alpine

services:
  - name: docker:27.2.0-dind
    command: ["--tls=false"]

variables:
  DOCKER_COMPOSE_VERSION: "2.21.0"
  # Update Docker connection settings
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "/certs/client"
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2

stages:
  - build
  # - test
  # - deploy
  # - cleanup

default:
  tags:
    - new-runner

before_script:
  - |
    if [ -z "$NGINX_USER" ] || [ -z "$NGINX_PASS" ]; then
      echo "Error: Required variables NGINX_USER and/or NGINX_PASS are not set"
      exit 1
    fi
  - apk add --no-cache py-pip python3-dev libffi-dev openssl-dev gcc libc-dev make curl
  # Install Docker Compose directly from GitHub releases
  - |
    curl -L "https://github.com/docker/compose/releases/download/v${DOCKER_COMPOSE_VERSION}/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
    chmod +x /usr/local/bin/docker-compose
  - docker info
  - docker-compose --version

build:
  stage: build
  script:
    - echo "Building the images..."
    - docker-compose build
    - echo "Build completed"
  rules:
    - if: '$CI_COMMIT_BRANCH == "project"'

